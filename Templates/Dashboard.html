<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div>Porter Catering</div>
        <a href="/logout">Logout</a>
    </header>
    <div class="container">
        <h2>Hello, {{ name }}</h2>
        <a href="/new" class="btn big green">+ New Flight</a>
        <h3>Recent Flights</h3>
        {% if flights %}
            {% for flight in flights %}
                <a href="/flight/{{ flight.id }}" class="flight-card">
                    <strong>{{ flight.flight_number }}</strong><br>
                    {{ flight.date }} at {{ flight.time }}<br>
                    <small>{{ flight.guard_name }}</small>
                </a>
            {% endfor %}
        {% else %}
            <p>No flights yet.</p>
        {% endif %}
    </div>
</body>
</html>
